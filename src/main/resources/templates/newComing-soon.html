<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Sequoia — Fase de Testes</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --bg: #0a0a0a; --text: #f0f0f0; --text-muted: #888888; --border: #2a2a2a; }
        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; margin: 0;}
        .container { padding: 40px; background: #111; border: 1px solid var(--border); border-radius: 16px; max-width: 500px; width: 100%; border-top: 4px solid #3498db; }
        .logo-img { width: 220px; margin: 0 auto 30px; display: block; }
        .icon-box { font-size: 3rem; color: #3498db; margin-bottom: 20px; }
        h1 { font-family: 'Syne', sans-serif; font-size: 1.8rem; margin-bottom: 15px; text-transform: uppercase; }
        p { color: var(--text-muted); line-height: 1.6; margin-bottom: 30px; font-size: 0.95rem; }
        .btn-main { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: var(--text); color: var(--bg); border: none; padding: 14px 24px; border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.2s; text-decoration: none; }
        .btn-main:hover { opacity: 0.8; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <img src="/whiteSequoiaLogo.png" alt="Sequoia Logo" class="logo-img">
        <div class="icon-box"><i class="fas fa-hard-hat"></i></div>
        <h1>Aplicação em Fase de Testes</h1>
        <p>O <strong>StandByTool</strong> está atualmente restrito à equipa de Gestão para validações.<br><br>Aguarde o lançamento oficial! 🚀</p>
        <form action="/logout" method="post" style="margin:0;">
            <button type="submit" class="btn-main"><i class="fas fa-sign-out-alt"></i> Mudar de Conta</button>
        </form>
    </div>
</body>
</html>
